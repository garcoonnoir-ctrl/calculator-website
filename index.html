<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickCalc - Free Online Calculators</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 0;
            color: #222;
        }

        header {
            background: #111827;
            color: white;
            text-align: center;
            padding: 30px 15px;
        }

        header h1 {
            margin: 0;
            font-size: 36px;
        }

        header p {
            margin-top: 10px;
            font-size: 17px;
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
        }

        .calculator {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0 15px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 7px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #1d4ed8;
        }

        #result {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #666;
        }
    </style>
</head>

<body>

<header>
    <h1>QuickCalc</h1>
    <p>Free, simple and useful online calculators</p>
</header>

<div class="container">

    <div class="calculator">
        <h2>Percentage Calculator</h2>

        <label>What is</label>
        <input type="number" id="number" placeholder="Enter a number">

        <label>percent of</label>
        <input type="number" id="percent" placeholder="Enter percentage">

        <button onclick="calculatePercentage()">Calculate</button>

        <div id="result"></div>
    </div>

</div>

<footer>
    © 2026 QuickCalc
</footer>

<script>
function calculatePercentage() {
    const number = parseFloat(document.getElementById("number").value);
    const percent = parseFloat(document.getElementById("percent").value);
    const result = document.getElementById("result");

    if (isNaN(number) || isNaN(percent)) {
        result.textContent = "Please enter both numbers.";
        return;
    }

    const answer = (number * percent) / 100;

    result.textContent = percent + "% of " + number + " = " + answer;
}
</script>

</body>
</html>
